<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eisbär-Prüfung</title>
<style>
:root{--bg:#eaf6ff;--fg:#0b2540;--card:#fff;--ac:#2b8cff;--mut:#6a86a3;--line:#cfe3f3;--ok:#1a9b5b}
@media (prefers-color-scheme:dark){:root{--bg:#07182b;--fg:#e6f3ff;--card:#0f2a47;--ac:#5aaeff;--mut:#8fb0cf;--line:#1d4268;--ok:#3ddc97}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;align-self:flex-start}
h1{font-size:1.3rem;margin:0 0 6px}p{margin:0 0 14px;color:var(--mut);line-height:1.45}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:.95rem;font-weight:600;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}
.task{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.task h2{font-size:1.05rem;margin:0 0 4px}
.st{font-weight:700;margin-top:8px;color:var(--ok)}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:1rem;margin-bottom:6px}
input[type=file]{margin:8px 0;max-width:100%}
.msg{min-height:1.4em;font-weight:600;margin:8px 0}
.rk{display:flex;align-items:center;gap:12px;margin:12px 0}.rk b{font-size:1.4rem;width:24px;text-align:center}
.rk img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:2px solid var(--line)}
.rk .bw{flex:1}.bar{height:14px;border-radius:7px;background:linear-gradient(90deg,#2b8cff,#7fe0ff)}.rk small{display:block;color:var(--mut);margin-top:4px}
.finale{background:#0b2540;border-radius:14px;padding:20px 12px 10px;text-align:center;overflow:hidden;margin-top:18px}
.bubble{background:#fff;color:#0b2540;border-radius:14px;padding:14px;font-weight:700;font-size:1.1rem;min-height:4.2em;margin-bottom:18px;position:relative;opacity:0;transition:opacity .3s}
.bubble.show{opacity:1}
.bubble:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-bottom:0;border-top-color:#fff}
#bear{width:140px;image-rendering:pixelated;transform:translateY(160px);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}#bear.up{transform:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== EINSTELLUNGEN ===== */
const CONFIG={
  // Discord: Servereinstellungen > Integrationen > Webhooks > Neuer Webhook > URL kopieren
  webhook:'HIER_DEINE_DISCORD_WEBHOOK_URL_EINTRAGEN',
  // SHA-256-Hashes der gültigen Freischalt-Codes (erzeugen mit admin.html). Standard-Code: eisbaer
  codeHashes:['34364f3404509e9da4a30754d87d231de5ae8cb3ef27b55c1acd768351a8dcdf']
};
/* ========================= */
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const T=[
 {k:'circle',t:'Aufgabe 1: Perfect Circle',u:'https://neal.fun/perfect-circle/',n:'Schaffe mindestens 95 %.'},
 {k:'color',t:'Aufgabe 2: Dialed Color',u:'https://dialed.gg/color',n:'Schaffe mindestens 47,5 von 50 Punkten (das sind 95 %).'}
];
const RANK=[['platz1.png','Am coolsten',100],['platz2.png','Sehr cool',78],['platz3.png','Ganz okay',56],['platz4.png','Ausbaufähig',34]];
let S={name:'',sent:{},unlocked:false};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('eb')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('eb',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=t=>{const m=$('#msg');if(m)m.textContent=t};

function render(){
  if(S.unlocked)return reveal();
  const both=T.every(t=>S.sent[t.k]);
  let h='<h1>Eisbär-Prüfung</h1><p>Spiele beide Spiele auf den Original-Seiten, mache einen Screenshot von deinem Ergebnis und lade ihn hier hoch. Wenn alles geprüft ist, bekommst du einen Code, der die Überraschung freischaltet.</p>'+
   '<input type="text" id="nm" placeholder="Dein Name" value="'+esc(S.name)+'">';
  T.forEach(t=>{
    h+='<div class="task"><h2>'+t.t+'</h2><p>'+t.n+'</p><a class="btn" href="'+t.u+'" target="_blank" rel="noopener">Zum Original-Spiel</a><br>';
    h+=S.sent[t.k]?'<div class="st">Screenshot gesendet ✓ (wartet auf Prüfung)</div>':
      '<input type="file" accept="image/*" id="f_'+t.k+'"><br><button class="btn" data-k="'+t.k+'">Screenshot senden</button>';
    h+='</div>';
  });
  if(both)h+='<div class="task"><h2>Freischalt-Code</h2><p>Sobald dein Ergebnis genehmigt wurde, bekommst du einen Code.</p><input type="text" id="cd" placeholder="Code eingeben"><button class="btn" id="go">Freischalten</button></div>';
  h+='<div class="msg" id="msg"></div>';
  $('#app').innerHTML=h;
  $('#nm').oninput=e=>{S.name=e.target.value;save()};
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>send(b.dataset.k));
  if(both)$('#go').onclick=unlock;
}
async function send(k){
  const t=T.find(x=>x.k===k),f=$('#f_'+k).files[0],name=S.name.trim();
  if(!name)return msg('Bitte zuerst deinen Namen eintragen.');
  if(!f)return msg('Bitte einen Screenshot auswählen.');
  if(CONFIG.webhook.indexOf('HIER_')===0)return msg('Die Seite ist noch nicht eingerichtet (Webhook fehlt).');
  msg('Sende …');
  const fd=new FormData();
  fd.append('payload_json',JSON.stringify({content:'**'+name+'**: '+t.t}));
  fd.append('files[0]',f,f.name);
  try{const r=await fetch(CONFIG.webhook,{method:'POST',body:fd});if(!r.ok)throw new Error('Fehler '+r.status);S.sent[k]=1;save();render()}
  catch(e){msg('Senden fehlgeschlagen ('+e.message+'). Versuche es nochmal.')}
}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function unlock(){
  const h=await sha($('#cd').value.trim().toLowerCase());
  if(CONFIG.codeHashes.includes(h)){S.unlocked=true;save();render()}else msg('Falscher Code.');
}
function bearSvg(){
  const r=(x,y,w,h,f)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"/>',W='#f4fbff',S2='#cfe3ee',K='#1a1a1a';
  return '<svg id="bear" viewBox="0 0 16 22" shape-rendering="crispEdges">'+r(4,0,2,2,W)+r(10,0,2,2,W)+r(5,1,1,1,S2)+r(10,1,1,1,S2)+r(4,2,8,7,W)+r(6,6,4,3,S2)+r(7,6,2,1,K)+r(5,4,1,1,K)+r(10,4,1,1,K)+r(3,9,10,8,W)+r(1,9,2,7,W)+r(13,9,2,7,W)+r(1,15,2,1,S2)+r(13,15,2,1,S2)+r(4,17,3,5,W)+r(9,17,3,5,W)+r(4,21,3,1,S2)+r(9,21,3,1,S2)+'</svg>';
}
async function reveal(){
  let h='<h1>Geschafft!</h1><p>Hier ist die Coolness-Skala:</p>';
  RANK.forEach((x,i)=>{h+='<div class="rk"><b>'+(i+1)+'</b><img src="'+x[0]+'" alt="Platz '+(i+1)+'"><div class="bw"><div class="bar" style="width:'+x[2]+'%"></div><small>'+x[1]+'</small></div></div>'});
  h+='<div class="finale"><div class="bubble" id="bub"></div>'+bearSvg()+'</div>';
  $('#app').innerHTML=h;
  await sleep(700);$('#bear').classList.add('up');
  await sleep(800);const b=$('#bub');b.classList.add('show');
  const t='Leck Eier. Dachtest du, du bekommst irgendwas?';
  for(let i=1;i<=t.length;i++){b.textContent=t.slice(0,i);await sleep(45)}
}
render();
</script>
</body>
</html>
